<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>CapraLink</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f4f4f6; --fg: #1c1c1e; --sub: #6b6b72; --card: #ffffff;
    --border: #d9d9de; --accent: #3a7afe; --danger: #d92d20;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1c1c1e; --fg: #f2f2f3; --sub: #9a9aa2; --card: #2a2a2d; --border: #3d3d41; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 12px;
    background: var(--bg); color: var(--fg);
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 13px;
  }
  h1 { font-size: 16px; margin: 0; }
  header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .pill {
    padding: 3px 10px; border-radius: 999px; font-size: 11px; font-weight: 600;
    background: var(--border); color: var(--sub);
  }
  .pill.on { background: #d7f5e0; color: #1a7a3c; }
  section { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 8px 10px 2px; margin-bottom: 8px; }
  label { display: block; font-size: 11px; color: var(--sub); margin-bottom: 4px; }
  input, select {
    width: 100%; padding: 6px 8px; border-radius: 6px; border: 1px solid var(--border);
    background: var(--bg); color: var(--fg); font-size: 13px; margin-bottom: 8px;
  }
  .row { display: flex; gap: 8px; }
  .row > div { flex: 1; }
  .seg { display: flex; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; margin-bottom: 8px; }
  .seg button {
    flex: 1; padding: 6px; border: none; background: var(--bg); color: var(--fg); cursor: pointer; font-size: 13px;
  }
  .seg button.active { background: var(--accent); color: white; }
  input[type=range] { padding: 0; margin-bottom: 4px; }
  .bitrate-val { font-size: 11px; color: var(--sub); text-align: right; margin-bottom: 8px; }
  h2 { font-size: 11px; color: var(--sub); font-weight: 600; margin: 0 0 6px; text-transform: uppercase; letter-spacing: .04em; }
  .me-name { font-weight: 600; margin-bottom: 4px; }
  .pin { font-size: 30px; font-weight: 700; letter-spacing: .12em; font-variant-numeric: tabular-nums; }
  .hint { font-size: 11px; color: var(--sub); margin-bottom: 8px; }
  .dev { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-top: 1px solid var(--border); }
  .dev:first-of-type { border-top: none; }
  .dev .info { flex: 1; min-width: 0; }
  .dev .name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dev .st { font-size: 11px; color: var(--sub); }
  .btn {
    padding: 5px 12px; border: none; border-radius: 6px; font-size: 12px; font-weight: 600;
    background: var(--accent); color: white; cursor: pointer; width: auto; margin: 0;
  }
  .btn.stop { background: var(--danger); }
  .btn:disabled { opacity: .5; cursor: default; }
  .link { border: none; background: none; color: var(--sub); font-size: 11px; cursor: pointer; padding: 2px 4px; text-decoration: underline; }
  .pairbox { display: flex; gap: 6px; align-items: center; padding: 0 0 8px; }
  .pairbox input { margin: 0; letter-spacing: .2em; font-variant-numeric: tabular-nums; }
  .empty { color: var(--sub); font-size: 12px; padding: 4px 0 10px; }
  #error { color: var(--danger); font-size: 11px; margin-top: 6px; min-height: 14px; }
  #stats { font-size: 11px; color: var(--sub); text-align: center; }
  .meters { display: grid; grid-template-columns: auto 1fr; gap: 4px 8px; align-items: center; font-size: 11px; color: var(--sub); margin-top: 10px; }
  meter { width: 100%; height: 8px; }
</style>
</head>
<body>
  <header>
    <h1>CapraLink</h1>
    <span class="pill" id="status">Idle</span>
  </header>

  <section>
    <h2>This device</h2>
    <div class="me-name" id="myName"></div>
    <div class="pin" id="pin">––– –––</div>
    <div class="hint">Enter this PIN on the other computer to pair</div>
  </section>

  <section>
    <h2>Devices</h2>
    <div id="devices"><div class="empty">Looking for other CapraLink computers on this network…</div></div>
  </section>

  <section>
    <label>Send from</label>
    <select id="input"></select>
    <label>Play to</label>
    <select id="output"></select>
  </section>

  <section>
    <label>Channels</label>
    <div class="seg" id="channels">
      <button data-v="1" class="active">Mono</button>
      <button data-v="2">Stereo</button>
    </div>
    <label>Bitrate</label>
    <input id="bitrate" type="range" min="8" max="96" step="8" value="64" />
    <div class="bitrate-val" id="bitrateVal">64 kbps</div>
  </section>

  <div class="meters">
    <span>Sending</span><meter id="inLevel" min="-60" max="0" low="-20" high="-6" optimum="-30" value="-60"></meter>
    <span>Receiving</span><meter id="outLevel" min="-60" max="0" low="-20" high="-6" optimum="-30" value="-60"></meter>
  </div>
  <div id="stats" style="margin-top:8px;"></div>
  <div id="error"></div>


<script>
const { invoke } = window.__TAURI__.core;
const $ = (id) => document.getElementById(id);
const els = {
  input: $('input'), output: $('output'), channels: $('channels'), bitrate: $('bitrate'),
  bitrateVal: $('bitrateVal'), error: $('error'), status: $('status'), stats: $('stats'), devices: $('devices'),
};

let channels = 1;
let settingsLoaded = false;
let actionError = '';
let busy = false;
let pairingId = null;   // device whose PIN box is open
let pinDraft = '';
let lastDevices = '';
let devices = [];

function setChannels(v) {
  channels = v;
  for (const b of els.channels.children) b.classList.toggle('active', Number(b.dataset.v) === v);
}

// ---- actions ----
async function act(cmd, args) {
  busy = true; actionError = ''; lastDevices = ''; render();
  try { await invoke(cmd, args); } catch (e) { actionError = String(e); }
  busy = false; lastDevices = '';
  await poll();
}

function saveSettings() {
  act('set_settings', { settings: {
    input: els.input.value || null, output: els.output.value || null,
    bitrate: Number(els.bitrate.value) * 1000, channels,
  }});
}

els.channels.addEventListener('click', (e) => {
  if (e.target.tagName !== 'BUTTON') return;
  setChannels(Number(e.target.dataset.v));
  saveSettings();
});
els.bitrate.addEventListener('input', () => { els.bitrateVal.textContent = els.bitrate.value + ' kbps'; });
els.bitrate.addEventListener('change', saveSettings);
els.input.addEventListener('change', saveSettings);
els.output.addEventListener('change', saveSettings);

// ---- devices list ----
function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

function button(text, cls, onclick) {
  const b = el('button', cls, text);
  b.disabled = busy;
  b.addEventListener('click', onclick);
  return b;
}

function render() {
  // rebuild only when something changed, so a half-typed PIN survives the 1 s poll
  const sig = JSON.stringify([devices, pairingId, busy]);
  if (sig === lastDevices) return;
  lastDevices = sig;
  const list = els.devices;
  list.innerHTML = '';
  if (!devices.length) {
    list.appendChild(el('div', 'empty', 'Looking for other CapraLink computers on this network…'));
    return;
  }
  for (const d of devices) {
    const row = el('div', 'dev');
    const info = el('div', 'info');
    info.appendChild(el('div', 'name', d.name));
    info.appendChild(el('div', 'st', d.connected ? 'Paired · Connected' : d.paired ? (d.online ? 'Paired · Online' : 'Paired · Offline') : 'Not paired'));
    row.appendChild(info);
    if (d.paired) row.appendChild(button('Forget', 'link', () => act('forget', { id: d.id })));
    if (!d.paired) {
      row.appendChild(button('Pair', 'btn', () => { pairingId = pairingId === d.id ? null : d.id; pinDraft = ''; render(); }));
    } else if (d.connected) {
      row.appendChild(button('Disconnect', 'btn stop', () => act('disconnect')));
    } else if (d.online) {
      row.appendChild(button('Connect', 'btn', () => act('connect', { id: d.id })));
    }
    list.appendChild(row);
    if (pairingId === d.id && !d.paired) {
      const box = el('div', 'pairbox');
      const pin = el('input');
      pin.maxLength = 6; pin.inputMode = 'numeric'; pin.placeholder = '6-digit PIN'; pin.value = pinDraft;
      const confirm = () => { const p = pin.value; pairingId = null; act('pair', { id: d.id, pin: p }); };
      pin.addEventListener('input', () => { pin.value = pin.value.replace(/\D/g, ''); pinDraft = pin.value; });
      pin.addEventListener('keydown', (e) => { if (e.key === 'Enter') confirm(); });
      box.appendChild(pin);
      box.appendChild(button('Confirm', 'btn', confirm));
      list.appendChild(box);
      setTimeout(() => pin.focus());
    }
  }
}

// keeps a saved device selectable even while it is unplugged
function setSel(sel, v) {
  if (v && ![...sel.options].some((o) => o.value === v)) {
    const o = document.createElement('option');
    o.value = v; o.textContent = v + ' (not found)';
    sel.appendChild(o);
  }
  sel.value = v || '';
}

// ---- polling ----
const db = (p) => Math.max(-60, 20 * Math.log10(p));

async function poll() {
  let st;
  try { st = await invoke('state'); } catch (e) { els.error.textContent = String(e); return; }
  $('myName').textContent = st.name;
  $('pin').textContent = st.pin.slice(0, 3) + ' ' + st.pin.slice(3);
  if (!settingsLoaded) {
    settingsLoaded = true;
    const s = st.settings;
    setSel(els.input, s.input);
    setSel(els.output, s.output);
    els.bitrate.value = Math.round(s.bitrate / 1000);
    els.bitrateVal.textContent = els.bitrate.value + ' kbps';
    setChannels(s.channels);
  }
  devices = st.devices;
  render();
  const peer = devices.find((d) => d.connected);
  els.status.textContent = peer ? 'Streaming — ' + peer.name : 'Idle';
  els.status.classList.toggle('on', !!peer);
  const s = st.stats;
  if (s) {
    inLevel.value = db(s.in_peak);
    outLevel.value = db(s.out_peak);
    els.stats.textContent =
      `sent ${s.sent} · recv ${s.received} · lost ${s.lost} · fec ${s.fec_recovered} · underruns ${s.underruns} · buf ${s.buffer_ms.toFixed(0)}/${s.target_ms.toFixed(0)}ms · gap tx ${s.tx_gap_ms.toFixed(0)} rx ${s.rx_gap_ms.toFixed(0)}ms`;
  } else {
    inLevel.value = outLevel.value = -60;
    els.stats.textContent = '';
  }
  els.error.textContent = actionError || st.error || '';
}

async function loadDevices() {
  const d = await invoke('devices');
  const fill = (sel, list) => {
    sel.innerHTML = '';
    const def = document.createElement('option');
    def.value = ''; def.textContent = 'System default';
    sel.appendChild(def);
    for (const name of list) {
      const o = document.createElement('option');
      o.value = name; o.textContent = name;
      sel.appendChild(o);
    }
  };
  fill(els.input, d.inputs);
  fill(els.output, d.outputs);
}

(async function init() {
  await loadDevices(); // options must exist before saved selections can apply
  await poll();
  setInterval(() => { if (!busy) poll(); }, 1000);
})();
</script>
</body>
</html>
