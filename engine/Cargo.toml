[package]
name = "capralink_engine"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"

[[bin]]
name = "capralinkd"
path = "src/main.rs"

[dependencies]
ctrlc = { version = "3.5", features = ["termination"] }
anyhow = "1"
chacha20poly1305 = "0.11.0"
cpal = "0.18"
dirs = "7.0.0"
getrandom = "0.4.3"
hkdf = "0.13.0"
hmac = "0.13.0"
mdns-sd = "0.21.4"
opus = "0.4"
ringbuf = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
snow = { version = "0.10.0", default-features = false, features = ["default-resolver", "use-chacha20poly1305", "use-sha2", "use-curve25519", "use-getrandom", "risky-raw-split"] }
spake2 = "0.4.0"
time = "0.3"

# PulseAudio host (also serves PipeWire via pipewire-pulse); ALSA stays the fallback.
[target.'cfg(target_os = "linux")'.dependencies]
cpal = { version = "0.18", features = ["pulseaudio"] }
