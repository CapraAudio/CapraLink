name: ci
on:
  push:
    branches: [main, "test/**"] # test/* branches build installers for trying a change before release
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-26
            name: macOS
          - os: ubuntu-24.04
            name: Linux
          - os: windows-2025
            name: Windows
    runs-on: ${{ matrix.os }}
    # Tauri's updater signing key (minisign): without it (forks, pull requests) the build still
    # succeeds, just without the signed updater files
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      # macOS: our own (self-signed) code-signing certificate, so macOS sees every build as the same
      # app and keeps its permissions (microphone, Input Monitoring) across updates; ad-hoc without it
      MACOS_SIGNING_P12: ${{ secrets.MACOS_SIGNING_P12 }}
      MACOS_SIGNING_PASSWORD: ${{ secrets.MACOS_SIGNING_PASSWORD }}
    steps:
      # third-party actions pinned to full commit SHAs (tag in the comment)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # history and tags, for the test-build number below
      # test builds show "vX.Y.Z.alpha-build.N" in the app (N = commits since the last release tag),
      # so a tester can tell builds apart; release tags show plain "vX.Y.Z"
      - if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        shell: bash
        run: echo "CAPRALINK_BUILD=alpha-build.$(git rev-list --count "$(git describe --tags --abbrev=0)..HEAD")" >> "$GITHUB_ENV"
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev libfuse2t64 rpm
      - if: runner.os == 'macOS'
        run: rustup target add x86_64-apple-darwin aarch64-apple-darwin
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo install tauri-cli --version 2.12.0 --locked
      - run: cargo test --workspace --locked
      - name: bundle (macOS universal app + installer package)
        if: runner.os == 'macOS'
        run: |
          if [ -n "$MACOS_SIGNING_P12" ]; then
            kc=$RUNNER_TEMP/signing.keychain-db
            security create-keychain -p ci "$kc" && security set-keychain-settings "$kc" && security unlock-keychain -p ci "$kc"
            base64 -d <<<"$MACOS_SIGNING_P12" > "$RUNNER_TEMP/signing.p12"
            security import "$RUNNER_TEMP/signing.p12" -k "$kc" -P "$MACOS_SIGNING_PASSWORD" -T /usr/bin/codesign
            rm "$RUNNER_TEMP/signing.p12"
            security set-key-partition-list -S apple-tool:,apple: -s -k ci "$kc" > /dev/null
            security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
            # codesign only uses a certificate trusted for code signing
            security find-certificate -c "CapraLink Code Signing" -p "$kc" > "$RUNNER_TEMP/signing.pem"
            sudo security add-trusted-cert -d -r trustRoot -p codeSign -k /Library/Keychains/System.keychain "$RUNNER_TEMP/signing.pem"
            export APPLE_SIGNING_IDENTITY="CapraLink Code Signing" # overrides tauri.conf.json's ad-hoc "-"
          fi
          sign=(); [ -z "$TAURI_SIGNING_PRIVATE_KEY" ] || sign=(--config '{"bundle":{"createUpdaterArtifacts":true}}')
          cargo tauri build --target universal-apple-darwin --bundles app "${sign[@]}" -- --locked
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "capralink") | .version')
          bundle=target/universal-apple-darwin/release/bundle/macos
          codesign -dvv $bundle/CapraLink.app 2>&1 | grep -E "^(Authority|Signature|TeamIdentifier)=" || true; codesign -d -r- $bundle/CapraLink.app
          packaging/macos/build-pkg.sh $bundle/CapraLink.app "$version" dist
          # the in-app update replaces just the .app (the pkg also installs the audio drivers)
          [ -z "$TAURI_SIGNING_PRIVATE_KEY" ] || for e in "" .sig; do cp "$bundle/CapraLink.app.tar.gz$e" "dist/CapraLink-$version-macOS.app.tar.gz$e"; done
      - name: bundle (Linux)
        if: runner.os == 'Linux'
        run: |
          sign=(); [ -z "$TAURI_SIGNING_PRIVATE_KEY" ] || sign=(--config '{"bundle":{"createUpdaterArtifacts":true}}')
          cargo tauri build --bundles appimage,deb,rpm "${sign[@]}" -- --locked
          mkdir dist && cp target/release/bundle/appimage/*.AppImage* target/release/bundle/deb/*.deb target/release/bundle/rpm/*.rpm dist/
      - name: bundle (Windows installer)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          sign=(); [ -z "$TAURI_SIGNING_PRIVATE_KEY" ] || sign=(--config '{"bundle":{"createUpdaterArtifacts":true}}')
          cargo tauri build --bundles nsis "${sign[@]}" -- --locked
          mkdir dist && cp target/release/bundle/nsis/*.exe* dist/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: capralink-${{ matrix.name }}
          path: |
            dist/*
            target/release/capralink
            target/release/capralink.exe

  # Steam Deck Game Mode plugin (Decky Loader); node and npm come with the runner image
  decky:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: decky
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck && npm run build
      - run: |
          mkdir -p out/CapraLink
          cp -r dist main.py plugin.json package.json LICENSE out/CapraLink/
          rm -f out/CapraLink/dist/*.map
          cd out && zip -r CapraLink.zip CapraLink
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: capralink-decky-plugin
          path: decky/out/CapraLink.zip

  # a v* tag makes a draft GitHub Release with the installers and their SHA-256 sums;
  # it is published by hand after a look. latest.json (what the in-app updater reads) is made here
  # from the signed updater files; it is left out of SHA256SUMS.txt on purpose: it is metadata, and
  # the updater verifies the installers by signature, not by sum.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, decky]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
      - run: |
          mkdir release
          cp artifacts/*/dist/* release/
          cp artifacts/capralink-decky-plugin/CapraLink.zip "release/CapraLink-Decky-${GITHUB_REF_NAME#v}.zip" # Steam Deck Game Mode plugin
          cd release && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      # the release notes come from the annotated tag's message: a tag without a written description fails here
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # SemVer tag (vMAJOR.MINOR.PATCH) that matches the version the app was built with
          [[ "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || { echo "::error::$GITHUB_REF_NAME is not a vMAJOR.MINOR.PATCH tag"; exit 1; }
          ls release | grep -q "_${GITHUB_REF_NAME#v}_" || { echo "::error::the installers aren't version ${GITHUB_REF_NAME#v}: bump [workspace.package] version first"; exit 1; }
          ref=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME")
          [ "$(jq -r .object.type <<<"$ref")" = tag ] || { echo "::error::$GITHUB_REF_NAME is not an annotated tag with release notes"; exit 1; }
          # tag message = a plain title line ("CapraLink X.Y.Z", what the Tags page shows), a blank line,
          # then the Markdown release notes
          gh api "repos/$GITHUB_REPOSITORY/git/tags/$(jq -r .object.sha <<<"$ref")" -q .message | tail -n +3 > notes.md
          [ "$(wc -l < notes.md)" -ge 3 ] || { echo "::error::the $GITHUB_REF_NAME tag message needs a description of the changes"; exit 1; }
          # latest.json for the in-app updater. "drivers" = tree hash of drivers/macos at this tag: a macOS
          # build compares it with its own (app/build.rs) to know whether the audio drivers changed
          if ls release/*.sig > /dev/null 2>&1; then
            v=${GITHUB_REF_NAME#v}
            url=https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME
            mac=CapraLink-$v-macOS.app.tar.gz; win=$(cd release && ls *-setup.exe); lin=$(cd release && ls *.AppImage)
            drivers=$(gh api "repos/$GITHUB_REPOSITORY/contents/drivers?ref=$GITHUB_SHA" -q '.[] | select(.name == "macos").sha')
            [ -n "$drivers" ] || { echo "::error::can't find drivers/macos in $GITHUB_SHA"; exit 1; }
            jq -n --arg v "$v" --rawfile notes notes.md --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --arg drivers "$drivers" \
              --arg mac "$url/$mac" --rawfile macsig "release/$mac.sig" \
              --arg win "$url/$win" --rawfile winsig "release/$win.sig" \
              --arg lin "$url/$lin" --rawfile linsig "release/$lin.sig" \
              '{version: $v, notes: $notes, pub_date: $date, drivers: $drivers, platforms: {
                "darwin-aarch64": {url: $mac, signature: $macsig}, "darwin-x86_64": {url: $mac, signature: $macsig},
                "windows-x86_64": {url: $win, signature: $winsig}, "linux-x86_64": {url: $lin, signature: $linsig}}}' > release/latest.json
            cat release/latest.json
          else
            echo "::warning::no updater signatures (TAURI_SIGNING_PRIVATE_KEY secret missing): this release has no in-app update"
          fi
          gh release create "$GITHUB_REF_NAME" release/* --repo "$GITHUB_REPOSITORY" --draft --notes-file notes.md --title "CapraLink ${GITHUB_REF_NAME#v}"
